[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "silhouette-mobile-ar"
version = "0.2.0"
description = "Silhouette segmentation, geometry, occlusion, contact, and path-planning research reimplementation"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy>=1.26,<3", "opencv-python>=4.9,<5"]

[project.optional-dependencies]
train = ["torch>=2.1", "pillow>=10"]
onnx = ["onnx>=1.15", "onnxruntime>=1.17"]
yolo = ["ultralytics>=8.3,<9"]
dev = ["pytest>=8,<9"]

[project.scripts]
silhouette-ar = "silhouette_ar.cli:main"
silhouette-seg = "silhouette_ar.segtrain:main"

[tool.setuptools.packages.find]
where = ["src"]
